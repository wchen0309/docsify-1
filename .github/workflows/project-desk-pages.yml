name: Deploy Project Desk Preview

on:
  push:
    branches: [main]
    paths:
      - 'project-desk-preview/**'
      - '.github/workflows/project-desk-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Project Desk artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: project-desk-preview
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
