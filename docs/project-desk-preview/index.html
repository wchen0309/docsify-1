<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Desk</title></head><body style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;padding:24px;color:#20263a"><p>正在载入 Project Desk…</p><script>fetch('https://raw.githubusercontent.com/wchen0309/docsify-1/main/project-desk-preview/index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.text()}).then(html=>{html=html.replace("!/^\\d+(?:\\.\\d+){2,}$/.test(wbs)","!/^\\d+(?:\\.\\d+){1,}$/.test(wbs)");html=html.replace("if(/hold|搁置|未开始|not.?started|pending/.test(x))return '未开始';","if(/hold|搁置/.test(x))return '搁置';if(/未开始|not.?started|pending/.test(x))return '未开始';");html=html.replace("['未开始','进行中','已完成','已逾期']","['未开始','进行中','搁置','已完成','已逾期']");html=html.replace("<option>未开始</option><option>进行中</option><option>已完成</option><option>已逾期</option>","<option>未开始</option><option>进行中</option><option>搁置</option><option>已完成</option><option>已逾期</option>");html=html.replace("function openProject(id){pid=id;view='table';go('detail');renderDetail()}","let showCompletedTL=false;function toggleCompletedTL(){showCompletedTL=!showCompletedTL;renderDetail()}function openProject(id){pid=id;view='table';showCompletedTL=false;go('detail');renderDetail()}");html=html.replace("function renderDetail(){let p=db.projects.find(x=>x.id===pid),ts=db.tasks.filter(t=>t.projectId===pid);if(!p)return;","function renderDetail(){let p=db.projects.find(x=>x.id===pid),ts=db.tasks.filter(t=>t.projectId===pid);if(!p)return;let doneTL=ts.filter(t=>(Number(t.completion)||0)>=100).length,visibleTs=(p.type==='研发'&&!showCompletedTL)?ts.filter(t=>(Number(t.completion)||0)<100):ts;");html=html.replace("<button onclick=\"exportProjectFeishuCSV(\\''+p.id+'\\')\">导出飞书 CSV</button><button class=\"primary\"","<button onclick=\"exportProjectFeishuCSV(\\''+p.id+'\\')\">导出飞书 CSV</button><button class=\"soft\" onclick=\"toggleCompletedTL()\">'+(showCompletedTL?'隐藏已完成':'显示已完成（'+doneTL+'）')+'</button><button class=\"primary\"");html=html.replace("(view==='table'?table(ts):view==='kanban'?kanban(ts,cats):gantt(ts))","(view==='table'?table(visibleTs):view==='kanban'?kanban(visibleTs,cats):gantt(visibleTs))");html=html.replace('</body>','<scr'+'ipt src="./gantt-enhancements.js?v=20261026-2"></scr'+'ipt></body>');document.open();document.write(html);document.close()}).catch(e=>{document.body.innerHTML='<h2>Project Desk 加载失败</h2><p>请刷新页面。</p><pre>'+String(e)+'</pre>'})</script></body></html>
