<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fb"><title>Project Desk 项目管理</title>
<style>
:root{--bg:#f5f6fa;--ink:#20263a;--muted:#778096;--line:#e5e8f0;--accent:#5c63e8;--soft:#eef0ff;--ok:#1c9b63}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 13px;background:#fff;color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}.primary{background:var(--accent);color:white;box-shadow:none}.soft{background:var(--soft);color:var(--accent);box-shadow:none}.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:#f7f8f8ed;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.brand{font-weight:800}.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500}.layout{display:grid;grid-template-columns:190px 1fr;min-height:calc(100vh - 58px)}aside{padding:16px 10px;border-right:1px solid var(--line);background:#fafbfc}.nav{display:grid;gap:6px}.nav button{text-align:left;background:transparent;box-shadow:none;color:#667085}.nav button.active{background:var(--soft);color:var(--accent);font-weight:700}main{padding:22px;min-width:0}.page{display:none}.page.active{display:block}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}.heading h1{font-size:25px;margin:0}.heading p{margin:6px 0 0;color:var(--muted);font-size:13px}.filters,.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.chip,.tab{border-radius:999px;padding:8px 12px;background:white;color:#667085}.chip.on,.tab.on{background:#252b40;color:white;box-shadow:none}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.card,.panel{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 6px 24px #27365a0a}.card{cursor:pointer}.card h3{margin:12px 0}.tag{display:inline-block;font-size:11px;border-radius:99px;padding:5px 8px;background:#edf6ff;color:#2476a5}.tag.sales{background:#fff2df;color:#a96605}.tag.after{background:#eaf8ef;color:#25804b}.bar{height:6px;background:#eceef4;border-radius:99px;overflow:hidden;margin:12px 0}.bar i{display:block;height:100%;background:var(--accent)}.muted{color:var(--muted);font-size:12px}.panel{margin-bottom:14px}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.panelhead h2{font-size:17px;margin:0}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.tbl{width:100%;min-width:800px;border-collapse:collapse}.tbl th,.tbl td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}.tbl th{background:#f8f9fb;color:#667085}.tbl tr{cursor:pointer}.mobilelist{display:none;gap:9px}.task{padding:13px;border:1px solid var(--line);border-radius:14px;background:white}.task b{display:block;margin-bottom:7px}.taskmeta{display:grid;grid-template-columns:1fr 1fr;gap:5px;font-size:12px;color:var(--muted)}.kanban{display:grid;grid-template-columns:repeat(5,minmax(190px,1fr));gap:10px;overflow:auto}.lane{background:#eff1f6;border-radius:14px;padding:10px;min-height:180px}.lane h4{margin:4px 4px 10px}.mini{background:#fff;border:1px solid var(--line);border-radius:11px;padding:10px;margin-bottom:8px;cursor:pointer;font-size:13px}.steps{display:grid;gap:9px}.step{display:grid;grid-template-columns:45px 1fr auto;gap:10px;align-items:center;padding:13px;border:1px solid var(--line);border-radius:13px}.step.done{background:#effaf3;border-color:#d3efdd}.step strong{color:var(--accent)}.step small{display:block;color:var(--muted);margin-top:4px}.toggle{width:44px;height:26px;border-radius:99px;background:#dfe3eb;padding:3px}.toggle i{display:block;width:20px;height:20px;border-radius:50%;background:white;transition:.15s}.toggle.on{background:var(--ok)}.toggle.on i{transform:translateX(18px)}.wizard{max-width:640px;margin:auto}.wizcard{background:white;border:1px solid var(--line);border-radius:22px;padding:24px;min-height:410px;display:flex;flex-direction:column;box-shadow:0 8px 28px #27365a0b}.segments{display:flex;gap:5px;margin-bottom:25px}.segments i{height:5px;flex:1;border-radius:99px;background:#e9ebf2}.segments i.on{background:var(--accent)}.wizcard h2{font-size:24px;line-height:1.35;margin:9px 0 22px}.field{display:grid;gap:7px}.field input,.field textarea,.field select,.fieldrow input,.fieldrow select{width:100%;padding:13px;border:1px solid #dfe3eb;border-radius:12px;background:white}.field textarea{min-height:115px}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{text-align:left;border:1px solid var(--line);border-radius:13px;padding:14px;background:white;box-shadow:none}.option.sel{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:700}.wizfoot{margin-top:auto;padding-top:25px;display:flex;justify-content:space-between;gap:8px}.fieldrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal{display:none;position:fixed;inset:0;z-index:10;background:#12182b66;align-items:flex-end;justify-content:center}.modal.on{display:flex}.sheet{background:white;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.formgrid label{display:grid;gap:6px;font-size:12px;color:#667085}.formgrid .full{grid-column:1/-1}.savebar{display:flex;justify-content:flex-end;gap:8px;padding:18px 0 4px;position:sticky;bottom:0;background:white}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.kpis .panel{margin:0}.kpis b{font-size:24px;display:block}.kpis span{font-size:12px;color:var(--muted)}.fab{display:none}
@media(max-width:760px){.top{padding:11px 13px}.layout{display:block}aside{position:fixed;bottom:0;left:0;right:0;z-index:8;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border:0;border-top:1px solid var(--line);background:#fffffff2}.nav{grid-template-columns:repeat(4,1fr);gap:3px}.nav button{text-align:center;font-size:11px;padding:9px 2px}.nav button:before{display:block;font-size:17px;margin-bottom:3px}.nav button[data-id=projects]:before{content:"▦"}.nav button[data-id=quick]:before{content:"✎"}.nav button[data-id=tasks]:before{content:"☷"}.nav button[data-id=overview]:before{content:"◷"}main{padding:16px 12px 88px}.heading{align-items:flex-start;flex-direction:column}.heading h1{font-size:23px}.cards{grid-template-columns:1fr}.tablewrap{display:none}.mobilelist{display:grid}.kanban{grid-template-columns:84vw 84vw 84vw 84vw 84vw}.options{grid-template-columns:1fr}.wizcard{padding:20px 15px;min-height:calc(100dvh - 150px)}.wizcard h2{font-size:22px}.formgrid,.fieldrow{grid-template-columns:1fr}.formgrid .full{grid-column:auto}.kpis{grid-template-columns:1fr 1fr}.step{grid-template-columns:40px 1fr auto;padding:11px}.desktop{display:none}.fab{display:block;position:fixed;right:16px;bottom:76px;width:54px;height:54px;border-radius:17px;background:var(--accent);color:white;font-size:26px;box-shadow:0 8px 25px #5c63e855;z-index:7}}

/* Category and status colors for the R&D kanban and task table */
.lane{border-top:4px solid var(--lane-accent,#64748b);background:#f7f8fc}
.lane h4{color:var(--lane-accent,#334155)}
.mini{border-left:4px solid var(--lane-accent,#94a3b8);transition:box-shadow .15s,transform .15s}
.mini:hover{box-shadow:0 5px 16px #26334d14;transform:translateY(-1px)}
.status-badge{display:inline-flex;align-items:center;max-width:100%;padding:3px 8px;border-radius:999px;font-size:11px;line-height:1.45;font-weight:650;white-space:normal;border:1px solid transparent}
.status-done{background:#e2f0d9;color:#375623;border-color:#c6e0b4}
.status-progress{background:#dbeafe;color:#1d4ed8;border-color:#bfdbfe}
.status-review{background:#fff2cc;color:#7f6000;border-color:#ffe08a}
.status-hold{background:#e7e6e6;color:#595959;border-color:#d1d5db}
.status-overdue{background:#f4cccc;color:#9c0006;border-color:#ea9999}

</style></head><body>
<header class="top"><div class="brand">Project Desk<small>项目工作台 · 研发 / IPD / 售后</small></div><button class="primary" onclick="openWizard()">＋ 快速填报</button></header>
<div class="layout"><aside><nav class="nav"><button data-id="projects" class="active" onclick="go('projects')">项目</button><button data-id="quick" onclick="go('quick');startWizard()">快速填报</button><button data-id="tasks" onclick="go('tasks')">多维表</button><button data-id="overview" onclick="go('overview')">总览</button></nav></aside>
<main>
<section class="page active" id="projects"><div class="heading"><div><h1>项目总表</h1><p>先选项目，再进入任务。手机与电脑使用同一套页面。</p></div><button onclick="newProject()">＋ 新建项目</button></div><div id="pf" class="filters"></div><div id="projectCards" class="cards"></div></section>
<section class="page" id="detail"><div id="detailHost"></div></section>
<section class="page" id="quick"><div class="heading"><div><h1>快速填报</h1><p>问卷式填写，一页一题；不确定的字段可以跳过。</p></div></div><div class="wizard" id="wizardHost"></div></section>
<section class="page" id="tasks"><div class="heading"><div><h1>任务多维表</h1><p>所有项目统一任务数据，自动按项目和类别归类。</p></div><div><button onclick="exportCSV()">导出 WPS 表格</button> <button class="primary" onclick="openFeishuExport()">导出飞书数据</button></div></div><div id="tf" class="filters"></div><div id="taskHost"></div></section>
<section class="page" id="overview"><div class="heading"><div><h1>项目总览</h1><p>整体进度与任务状态。</p></div><button onclick="exportCSV()">导出 CSV</button></div><div id="overviewHost"></div></section>
</main></div><button class="fab" onclick="openWizard()">＋</button>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script>
const cats=['总','机械','硬件','下位机软件','软件'],m3cats=['机械','硬件','软件'],steps=['M1-任务需求审查','M2-技术可行性方案论证','M3-产品全周期设计与开发策划','M4-产品详细设计','Q3评审'];
const initial={projects:[['p1','单管动态','研发',62],['p2','双脉冲控制台','研发',48],['p3','静态','研发',70],['p4','建模','研发',35],['p5','SST模块双脉冲','销售交付',40],['p6','SSP模块双脉冲','销售交付',20],['p7','alaska软件','售后',55]].map(x=>({id:x[0],name:x[1],type:x[2],progress:x[3],ipd:x[2]==='销售交付'})),tasks:[{id:'t1',projectId:'p3',category:'系统',name:'评审并确认单管动静态测试盒接口方案',desc:'确认系统边界与接口',owner:'王琛',planStart:'2026-10-20',planEnd:'2026-10-27',actualStart:'2026-10-21',status:'进行中',completion:60,risk:'中',urgency:'高',output:'接口方案'},{id:'t2',projectId:'p3',category:'机械',name:'确认机柜布局与接口排布方案',owner:'',planStart:'2026-10-24',planEnd:'2026-11-03',status:'未开始',completion:10},{id:'t3',projectId:'p3',category:'硬件',name:'确认母线电容规格与模块适配方案',planStart:'2026-10-18',planEnd:'2026-10-31',actualStart:'2026-10-18',status:'进行中',completion:45,risk:'中'},{id:'t4',projectId:'p3',category:'BSW',name:'开发跨导测量调压板控制方案',planStart:'2026-10-28',planEnd:'2026-11-12',status:'未开始',completion:0},{id:'t5',projectId:'p3',category:'ASW',name:'开发损耗查表数据自动生成功能',planStart:'2026-11-01',planEnd:'2026-11-18',status:'未开始',completion:0},{id:'t6',projectId:'p5',category:'M3',m3Category:'机械',name:'完成A0电容板治具设计',desc:'M3任务',owner:'李工',planStart:'2026-10-28',planEnd:'2026-11-06',status:'进行中',completion:35},{id:'t7',projectId:'p7',category:'售后',name:'修复alaska软件现场反馈问题',owner:'王琛',planStart:'2026-10-25',planEnd:'2026-10-30',status:'进行中',completion:50}],ipd:{p5:{'M1-任务需求审查':true,'M2-技术可行性方案论证':true,'M4-产品详细设计':false,'Q3评审':false},p6:{'M1-任务需求审查':true,'M2-技术可行性方案论证':false,'M4-产品详细设计':false,'Q3评审':false}}};
let db;try{db=JSON.parse(localStorage.getItem('projectDeskData'))||initial}catch(e){db=initial}
function canonicalCategory(v){const x=String(v||'').trim();if(['系统','总','System'].includes(x))return '总';if(['BSW','下位机软件','底层软件'].includes(x))return '下位机软件';if(['ASW','软件','应用软件'].includes(x))return '软件';return x}
let _categoryMigrated=false;(db.tasks||[]).forEach(t=>{const c=canonicalCategory(t.category);if(c!==t.category){t.category=c;_categoryMigrated=true}});if(_categoryMigrated){try{localStorage.setItem('projectDeskData',JSON.stringify(db))}catch(e){}}
let filter='全部',taskfilter='全部',pid=null,view='table',wiz={step:0,data:{}},pendingTLImport=null;
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),attr=esc;
function save(){localStorage.setItem('projectDeskData',JSON.stringify(db))}
function go(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.id===id));if(id==='projects')renderProjects();if(id==='tasks')renderTasks();if(id==='overview')renderOverview()}
function renderProjects(){let fs=['全部','研发','销售交付','售后'];$('#pf').innerHTML=fs.map(x=>'<button class="chip '+(x===filter?'on':'')+'" onclick="filter=\''+x+'\';renderProjects()">'+x+'</button>').join('');$('#projectCards').innerHTML=db.projects.filter(p=>filter==='全部'||p.type===filter).map(p=>'<article class="card" onclick="openProject(\''+p.id+'\')"><span class="tag '+(p.type==='销售交付'?'sales':p.type==='售后'?'after':'')+'">'+p.type+(p.ipd?' · IPD':'')+'</span><h3>'+esc(p.name)+'</h3><div class="bar"><i style="width:'+p.progress+'%"></i></div><div class="muted">'+db.tasks.filter(t=>t.projectId===p.id).length+' 项任务 <span style="float:right">'+p.progress+'%</span></div></article>').join('')}
function newProject(){let name=prompt('项目名称？');if(!name)return;let type=prompt('项目类别：输入 研发、销售交付、售后','研发');if(!['研发','销售交付','售后'].includes(type)){alert('请输入：研发、销售交付或售后');return}let id='p'+Date.now();db.projects.push({id,name,type,progress:0,ipd:type==='销售交付'});if(type==='销售交付')db.ipd[id]={};save();renderProjects()}
function newProjectFromWizard(){$('#sheet').innerHTML='<div class="panelhead"><h2>新建项目</h2><button onclick="closeModal()">取消</button></div><div class="formgrid"><label class="full">项目名称<input id="npName" placeholder="例如：3.3 kV DCDC 双脉冲平台"></label><label class="full">项目类型<select id="npType"><option value="研发">研发</option><option value="销售交付">销售交付</option><option value="售后">售后</option></select></label></div><p class="muted">创建后会自动加入项目总表，并继续填写该项目的任务。</p><div class="savebar"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveWizardProject()">创建并继续</button></div>';$('#modal').classList.add('on');setTimeout(()=>$('#npName')?.focus(),0)}
function saveWizardProject(){let name=$('#npName').value.trim(),type=$('#npType').value;if(!name){alert('请填写项目名称');return}let same=db.projects.find(p=>String(p.name||'').trim().toLowerCase()===name.toLowerCase());if(same&&!confirm('已存在同名项目“'+name+'”，仍然新建一个吗？'))return;let id='p'+Date.now();db.projects.push({id,name,type,progress:0,ipd:type==='销售交付'});if(type==='销售交付')db.ipd[id]={};save();renderProjects();wiz.data.projectId=id;wiz.data.category=type==='售后'?'售后':type==='销售交付'?'M3':'';wiz.data.m3Category='机械';wiz.step=1;closeModal();drawWizard()}

function openProject(id){pid=id;view='table';go('detail');renderDetail()}
function renderDetail(){let p=db.projects.find(x=>x.id===pid),ts=db.tasks.filter(t=>t.projectId===pid);if(!p)return;let head='<div class="heading"><div><button onclick="go(\'projects\')">← 项目</button><h1 style="margin-top:12px">'+esc(p.name)+'</h1><p>'+p.type+' · '+ts.length+' 项任务</p></div><div class="desktop"><button class="primary" onclick="openWizard(\''+p.id+'\')">＋ 新任务</button> '+(p.type==='研发'?'<button class="soft" onclick="enterIpd(\''+p.id+'\')">进入 IPD 流程</button>':'')+'</div></div>';
let content='';if(p.type==='研发')content='<div class="panel"><div class="panelhead"><h2>研发 TL 看板</h2><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button onclick="selectTLFile(\''+p.id+'\')">导入 TL</button><button onclick="exportProjectFeishuXLSX(\''+p.id+'\')">导出飞书 Excel（保留公式）</button><button class="primary" onclick="openWizard(\''+p.id+'\')">＋ 任务</button></div></div><div class="tabs">'+[['table','多维表'],['kanban','看板'],['gantt','甘特图']].map(v=>'<button class="tab '+(view===v[0]?'on':'')+'" onclick="view=\''+v[0]+'\';renderDetail()">'+v[1]+'</button>').join('')+'</div>'+(view==='table'?table(ts):view==='kanban'?kanban(ts,cats):gantt(ts))+'</div>';
else if(p.type==='销售交付')content=ipdView(p,ts);else content='<div class="panel"><div class="panelhead"><h2>售后任务</h2><button class="primary" onclick="openWizard(\''+p.id+'\')">＋ 任务</button></div>'+mobileList(ts)+'</div>';
$('#detailHost').innerHTML=head+content}
function statusTone(t){
 const raw=String(t.legacyStatus||t.status||'').trim(),st=String(t.status||'').trim(),pct=Number(t.completion)||0;
 if(/超期|overdue/i.test(raw)||st==='已逾期')return 'status-overdue';
 if(/R&D:100%|已完成|complete|done/i.test(raw)||st==='已完成'||pct>=100)return 'status-done';
 if(/Hold|搁置/i.test(raw)||st==='搁置')return 'status-hold';
 if(/SIR:51-80%|R&D:81-99%|Reviewed:90%|评审/i.test(raw))return 'status-review';
 if(/Ongoing:1-50%|SIR:1-50%|进行中/i.test(raw)||st==='进行中')return 'status-progress';
 return 'status-todo';
}
function statusBadge(t){return '<span class="status-badge '+statusTone(t)+'">'+esc(t.legacyStatus||t.status||'未开始')+'</span>'}
function categoryColor(c){return ({'系统':'#4472c4','总':'#4472c4','机械':'#2f855a','硬件':'#b7791f','BSW':'#7c3aed','下位机软件':'#7c3aed','ASW':'#c2417a','软件':'#c2417a'})[c]||'#64748b'}
function table(ts){let headers=['任务名称','大类','责任人','计划开始','计划结束','实际开始','实际结束','状态','进度'];let rows=ts.map(t=>'<tr onclick="editTask(\''+t.id+'\')"><td><b>'+esc(t.name)+'</b><div class="muted">'+esc(t.desc||'')+'</div></td><td>'+esc(t.category)+'</td><td>'+esc(t.owner||'')+'</td><td>'+ (t.planStart||'')+'</td><td>'+(t.planEnd||'')+'</td><td>'+(t.actualStart||'')+'</td><td>'+(t.actualEnd||'')+'</td><td>'+statusBadge(t)+'</td><td>'+(t.completion||0)+'%</td></tr>').join('');return '<div class="tablewrap"><table class="tbl"><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</thead><tbody>'+rows+'</tbody></table></div>'+mobileList(ts)}
function mobileList(ts){return '<div class="mobilelist">'+ts.map(t=>'<div class="task" onclick="editTask(\''+t.id+'\')"><b>'+esc(t.name||'未命名任务')+'</b><div class="taskmeta"><span>'+esc(t.category||'')+'</span><span>'+esc(t.owner||'未分配')+'</span><span>'+(t.planStart||'未排期')+'</span>'+statusBadge(t)+'<span>'+(t.completion||0)+'%</span></div></div>').join('')+'</div>'}
function kanban(ts,cs){return '<div class="kanban">'+cs.map(c=>'<div class="lane" style="--lane-accent:'+categoryColor(c)+'"><h4>'+c+' · '+ts.filter(t=>canonicalCategory(t.category)===canonicalCategory(c)).length+'</h4>'+ts.filter(t=>canonicalCategory(t.category)===canonicalCategory(c)).map(t=>'<div class="mini" onclick="editTask(\''+t.id+'\')"><b>'+esc(t.name)+'</b><div class="muted">'+esc(t.owner||'未分配')+' · '+(t.completion||0)+'%</div>'+statusBadge(t)+'</div>').join('')+'</div>').join('')+'</div>'}

const qs=['project','category','name','desc','owner','dates','status'];function openWizard(id,m3=false){go('quick');startWizard(id,m3)}function startWizard(id,m3=false){wiz={step:id?1:0,data:{projectId:id||'',category:m3?'M3':''}};drawWizard()}function wset(k,v){wiz.data[k]=v;drawWizard()}function skip(){wiz.step++;if(wiz.step>=qs.length)submitWizard();else drawWizard()}function next(){wiz.step++;if(wiz.step>=qs.length)submitWizard();else drawWizard()}function prev(){if(wiz.step)wiz.step--;else{go('projects');return}drawWizard()}

else h='<div class="muted">进度状态</div><h2>目前做到哪一步？</h2><div class="field"><select onchange="wiz.data.status=this.value"><option>未开始</option><option>进行中</option><option>已完成</option><option>已逾期</option></select><label>完成度 <b id="pct">'+(d.completion||0)+'%</b></label><input type="range" min="0" max="100" step="5" value="'+(d.completion||0)+'" oninput="wiz.data.completion=+this.value;document.getElementById(\'pct\').textContent=this.value+\'%\'"></div>';
$('#wizardHost').innerHTML='<div class="wizcard"><div class="segments">'+qs.map((_,i)=>'<i class="'+(i<=wiz.step?'on':'')+'"></i>').join('')+'</div>'+h+'<div class="wizfoot"><button onclick="prev()">上一步</button><div><button onclick="skip()">跳过</button> <button class="primary" onclick="next()">'+(wiz.step===qs.length-1?'保存任务':'下一步')+'</button></div></div></div>'}
function submitWizard(){let d=wiz.data;if(!d.projectId){alert('请选择项目');wiz.step=0;drawWizard();return}db.tasks.push({id:'t'+Date.now(),projectId:d.projectId,category:d.category||'',m3Category:d.m3Category||'',name:d.name||'未命名任务',desc:d.desc||'',owner:d.owner||'',planStart:d.planStart||'',planEnd:d.planEnd||'',actualStart:'',actualEnd:'',status:d.status||'未开始',completion:+d.completion||0,risk:'',urgency:'',output:''});save();openProject(d.projectId)}

 {sheet:'TL-系统',aliases:['TL-系统','TL系统'],category:'总'},
 {sheet:'TL-机械',aliases:['TL-机械','TL机械'],category:'机械'},

const tlHeaders=[
'序号\n NO','任务名称\n Task Name','任务描述(遵循smart原则)\n Task Description\n (Follow the SMART principle)','前置任务项\n Pre-step','输出物\n Deliverables List','风险项等级\n Risk Level','紧急程度\n Emergency Level','责任人\n Task Owner','指导人\n （可选）\n Supervisor\n (Optional)','计划开始时间\n Planed Start','计划结束时间\n Planed End','PM查看（隐藏列）颗粒度＞14天标黄\n （自带公式）','任务评审人\n Reviewer','任务状态\n Status','超期提醒\n （未按照计划时间完成任务）\n (自带公式）','实际开始时间\n Actual Start Time','实际结束时间\n Actual End Time','完成时间差异（Day）\n （自带公式）','超期原因\n (delay reason)'
];
function tlExcelSerial(v){
 if(v===null||v===undefined||v==='')return '';
 if(typeof v==='number')return v;
 const x=String(v).trim();let m=x.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);let ms;
 if(m)ms=Date.UTC(+m[1],+m[2]-1,+m[3]);else{const d=new Date(x);if(isNaN(d))return x;ms=Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())}
 return Math.floor(ms/86400000)+25569;
}
function tlExportStatus(t){
 const raw=String(t.legacyStatus||'').trim();if(raw)return raw;
 const s=String(t.status||'').trim();const pct=Number(t.completion)||0;
 const valid=['TBD:0%','Ongoing:1-50%','SIR:51-80%','Reviewed:90%','R&D:100%','Hold'];
 if(valid.includes(s))return s;
 if(s==='已完成'||pct>=100)return 'R&D:100%';
 if(s==='进行中'||s==='已逾期'){if(pct<=0&&s!=='已逾期')return 'TBD:0%';if(pct<=50)return 'Ongoing:1-50%';if(pct<=80)return 'SIR:51-80%';return 'Reviewed:90%'}
 return 'TBD:0%';
}
function tlExcelDate(v){
 if(v===null||v===undefined||v==='')return null;
 if(v instanceof Date&&!isNaN(v))return new Date(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate()));
 const x=String(v).trim();let m=x.match(/^(\d{4})[-/.年](\d{1,2})[-/.月](\d{1,2})/);
 if(m)return new Date(Date.UTC(+m[1],+m[2]-1,+m[3]));
 const d=new Date(x);return isNaN(d)?null:new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
}
function tlBuildWorksheet(wb,map,ts){
 const ws=wb.addWorksheet(map.sheet);
 const groupRow=['任务简介 Task Introduction','','','','','风险&紧急度\n Risk & Emergency','','资源 Resource','','时间计划 Planed Time','','','评审&任务状态\n Review & Task status','','','时间监控 Monitor time','','偏差 Discrepancy','复盘'];
 ws.addRow(groupRow);
 ws.addRow(tlHeaders.slice());
 ws.mergeCells('A1:E1');ws.mergeCells('F1:G1');ws.mergeCells('H1:I1');ws.mergeCells('J1:L1');ws.mergeCells('M1:O1');ws.mergeCells('P1:Q1');
 const widths=[13,34,46,22,28,12,12,16,16,15,15,14,15,19,16,15,15,18,26];
 ws.columns=widths.map(width=>({width}));
 ws.getRow(1).height=34;ws.getRow(2).height=60;
 ws.views=[{state:'frozen',ySplit:2}];
 const maxRow=Math.max(200,ts.length+2);
 ws.autoFilter={from:{row:2,column:1},to:{row:Math.max(2,ts.length+2),column:19}};
 ts.forEach(t=>{
  const row=ws.addRow([
   t.wbs||'',t.name||'',t.desc||'',t.predecessor||'',t.output||'',t.risk||'',t.urgency||'',t.owner||'',t.supervisor||'',
   tlExcelDate(t.planStart),tlExcelDate(t.planEnd),null,t.reviewer||'',tlExportStatus(t),null,
   tlExcelDate(t.actualStart),tlExcelDate(t.actualEnd),null,t.delayReason||''
  ]);
  const n=row.number;
  row.getCell(12).value={formula:'IF(AND(J'+n+'<>"",K'+n+'<>""),K'+n+'-J'+n+'+1,"")'};
  row.getCell(15).value={formula:'IF(AND(K'+n+'<>"",N'+n+'<>"R&D:100%",TODAY()>K'+n+'),"超期","")'};
  row.getCell(18).value={formula:'IF(AND(Q'+n+'<>"",K'+n+'<>""),Q'+n+'-K'+n+',"")'};
  const statusValue=tlExportStatus(t),statusCell=row.getCell(14);
  const fill=(argb)=>({type:'pattern',pattern:'solid',fgColor:{argb}});
  if(/R&D:100%/.test(statusValue)){statusCell.fill=fill('FFE2F0D9');statusCell.font={bold:true,color:{argb:'FF375623'}}}
  else if(/TBD:0%|Hold/.test(statusValue)){statusCell.fill=fill('FFE7E6E6');statusCell.font={color:{argb:'FF595959'}}}
  else if(/SIR:51-80%|R&D:81-99%|Reviewed:90%/.test(statusValue)){statusCell.fill=fill('FFFFF2CC');statusCell.font={bold:true,color:{argb:'FF7F6000'}}}
  else if(/Ongoing:1-50%|SIR:1-50%/.test(statusValue)){statusCell.fill=fill('FFDBEAFE');statusCell.font={bold:true,color:{argb:'FF1D4ED8'}}}
  const plannedStart=row.getCell(10).value,plannedEnd=row.getCell(11).value;
  if(plannedStart instanceof Date&&plannedEnd instanceof Date){
   const days=Math.floor((plannedEnd.getTime()-plannedStart.getTime())/86400000)+1;
   if(days>14){row.getCell(12).fill=fill('FFFFF2CC');row.getCell(12).font={bold:true,color:{argb:'FF9C6500'}}}
   const today=new Date();today.setHours(0,0,0,0);
   if(plannedEnd<today&&!/R&D:100%/.test(statusValue)){row.getCell(15).fill=fill('FFF4CCCC');row.getCell(15).font={bold:true,color:{argb:'FF9C0006'}}}
  }
  [10,11,16,17].forEach(c=>{row.getCell(c).numFmt='yyyy-mm-dd'});
  [1,2,3,4,5,6,7,8,9,13,14,15,19].forEach(c=>{row.getCell(c).alignment={vertical:'top',wrapText:true}});
  [12,18].forEach(c=>{row.getCell(c).numFmt='0';row.getCell(c).alignment={horizontal:'center',vertical:'center'}});
 });
 // Data validation remains available even in blank rows, so users can keep adding TL tasks.
 ws.dataValidations.add('F3:F'+maxRow,{
  type:'list',allowBlank:true,formulae:['"低,中,高"'],showErrorMessage:true,errorStyle:'stop',
  errorTitle:'风险等级无效',error:'请选择：低、中或高',showInputMessage:true,promptTitle:'风险等级',prompt:'从下拉列表选择低、中或高。'
 });
 ws.dataValidations.add('G3:G'+maxRow,{
  type:'list',allowBlank:true,formulae:['"低,中,高"'],showErrorMessage:true,errorStyle:'stop',
  errorTitle:'紧急程度无效',error:'请选择：低、中或高',showInputMessage:true,promptTitle:'紧急程度',prompt:'从下拉列表选择低、中或高。'
 });
 ws.dataValidations.add('N3:N'+maxRow,{
  type:'list',allowBlank:true,formulae:['"TBD:0%,Ongoing:1-50%,SIR:51-80%,Reviewed:90%,R&D:100%,Hold"'],
  showErrorMessage:true,errorStyle:'stop',errorTitle:'任务状态无效',
  error:'请从任务状态下拉列表中选择。',showInputMessage:true,promptTitle:'任务状态',
  prompt:'TBD、Ongoing、SIR、Reviewed、R&D 或 Hold。'
 });
 // Header styling and readable body formatting.
 for(let c=1;c<=19;c++){
  const h=ws.getRow(1).getCell(c);h.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FF4472C4'}};
  h.font={bold:true,color:{argb:'FFFFFFFF'},size:10};
  h.alignment={horizontal:'center',vertical:'middle',wrapText:true};
  const sub=ws.getRow(2).getCell(c);sub.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFD9EAF7'}};
  sub.font={bold:true,color:{argb:'FF203864'},size:10};
  sub.alignment={horizontal:'center',vertical:'middle',wrapText:true};
 }
 for(let r=3;r<=ws.rowCount;r++){
  const row=ws.getRow(r);row.height=36;
  for(let c=1;c<=19;c++){
   const cell=row.getCell(c);
   cell.alignment=cell.alignment||{vertical:'top',wrapText:true};
   cell.border={bottom:{style:'hair',color:{argb:'FFD7DEEA'}}};
  }
 }
 if(ts.length){
  const last=Math.max(3,ts.length+2);
  ws.addConditionalFormatting({ref:'L3:L'+last,rules:[{
   type:'cellIs',operator:'greaterThan',formulae:[14],
   style:{font:{bold:true,color:{argb:'FF9C6500'}},fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF2CC'}}}
  }]});
  ws.addConditionalFormatting({ref:'O3:O'+last,rules:[{
   type:'expression',formulae:['O3="超期"'],
   style:{font:{bold:true,color:{argb:'FF9C0006'}},fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFF4CCCC'}}}
  }]});
  ws.addConditionalFormatting({ref:'N3:N'+last,rules:[
   {type:'expression',formulae:['N3="R&D:100%"'],style:{font:{bold:true,color:{argb:'FF375623'}},fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFE2F0D9'}}}},
   {type:'expression',formulae:['OR(N3="SIR:51-80%",N3="R&D:81-99%",N3="Reviewed:90%")'],style:{font:{bold:true,color:{argb:'FF7F6000'}},fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFFFF2CC'}}}},
   {type:'expression',formulae:['OR(N3="TBD:0%",N3="Hold")'],style:{font:{color:{argb:'FF595959'}},fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFE7E6E6'}}}},
   {type:'expression',formulae:['OR(N3="Ongoing:1-50%",N3="SIR:1-50%")'],style:{font:{bold:true,color:{argb:'FF1D4ED8'}},fill:{type:'pattern',pattern:'solid',fgColor:{argb:'FFDBEAFE'}}}}
  ]});
 }
 return ws;
}
function buildProjectTLWorkbook(projectId){
 const p=db.projects.find(x=>x.id===projectId);if(!p||p.type!=='研发')return null;
 if(!window.ExcelJS)return null;
 const wb=new ExcelJS.Workbook();
 wb.creator='Project Desk';wb.subject='研发 TL';wb.title='TL - '+p.name;
 wb.calcProperties={calcMode:'auto',fullCalcOnLoad:true,forceFullCalc:true};
 tlSheetMap.forEach((map,ci)=>{
  const ts=db.tasks.filter(t=>t.projectId===projectId&&canonicalCategory(t.category)===map.category)
   .slice().sort((a,b)=>String(a.wbs||'').localeCompare(String(b.wbs||''),undefined,{numeric:true}))
   .map((t,i)=>Object.assign({},t,{wbs:t.wbs||('1.'+(ci+1)+'.'+(i+1))}));
  tlBuildWorksheet(wb,map,ts);
 });
 return {wb,p};
}

async function downloadExcelJSWorkbook(built,filename){
 const buffer=await built.wb.xlsx.writeBuffer();
 const blob=new Blob([buffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);

async function runTLExport(projectId,filenamePrefix){
 try{
  if(!window.ExcelJS)throw new Error('Excel 导出组件 ExcelJS 没有加载。可能是网络/CDN 被拦截，请刷新或换网络后重试。');
  showExportMessage('正在生成 TL 工作簿，请稍候…');
  const built=buildProjectTLWorkbook(projectId);
  if(!built)throw new Error('未找到研发项目，请返回项目列表后重新进入该项目。');
  const safe=built.p.name.replace(/[\\/:*?"<>|]/g,'_');
  await downloadExcelJSWorkbook(built,filenamePrefix+safe+'.xlsx');
  showExportMessage('已生成 '+filenamePrefix+safe+'.xlsx。如果没有自动下载，请检查浏览器下载栏或下载权限。');
 }catch(e){
  console.error('TL export failed:',e);
  showExportMessage('导出失败：'+(e&&e.message?e.message:String(e)),true);
 }
}

function tlNorm(v){return String(v??'').trim().toLowerCase().replace(/[\s_\-（）():：·]+/g,'')}
function tlFindCol(headers,aliases){const hs=headers.map(tlNorm),aa=aliases.map(tlNorm);for(const a of aa){const exact=hs.findIndex(h=>h===a);if(exact>=0)return exact}return hs.findIndex(h=>aa.some(a=>h.includes(a)))}
function tlCell(row,i){return i>=0?(row[i]??''):''}
function tlText(v){if(v===null||v===undefined)return '';if(v instanceof Date)return v.toISOString().slice(0,10);return String(v).trim()}
function tlDate(v){if(v===null||v===undefined||v==='')return '';if(v instanceof Date&&!isNaN(v))return v.toISOString().slice(0,10);if(typeof v==='number'&&v>20000&&v<80000&&window.XLSX){const d=XLSX.SSF.parse_date_code(v);if(d)return String(d.y).padStart(4,'0')+'-'+String(d.m).padStart(2,'0')+'-'+String(d.d).padStart(2,'0')}const x=String(v).trim();let m=x.match(/^(\d{4})[./年-](\d{1,2})[./月-](\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');const dt=new Date(x);return !isNaN(dt)?dt.toISOString().slice(0,10):x}
function tlPercent(v){if(v===null||v===undefined||v==='')return null;if(typeof v==='number')return Math.max(0,Math.min(100,Math.round(v>0&&v<=1?v*100:v)));const x=String(v).trim();const m=x.match(/(\d+(?:\.\d+)?)\s*(?:-\s*(\d+(?:\.\d+)?))?\s*%/);if(m){const a=Number(m[1]),b=m[2]===undefined?a:Number(m[2]);return Math.max(0,Math.min(100,Math.round((a+b)/2)))}const n=Number(x);return Number.isFinite(n)?Math.max(0,Math.min(100,Math.round(n>0&&n<=1?n*100:n))):null}
function tlStatus(raw,pct){const x=String(raw||'').trim().toLowerCase();if(pct!==null&&pct>=100)return '已完成';if(/已完成|完成|complete|done/.test(x))return '已完成';if(/逾期|overdue|late/.test(x))return '已逾期';if(/hold|搁置|未开始|not.?started|pending/.test(x))return '未开始';if(/进行中|ongoing|reviewed|sir|r&d/.test(x))return '进行中';return pct>0?'进行中':'未开始'}
function tlSameTask(a,b){const ca=canonicalCategory(a.category),cb=canonicalCategory(b.category);if(ca!==cb)return false;const wa=String(a.wbs||'').trim(),wb=String(b.wbs||'').trim();if(wa&&wb&&wa===wb)return true;return String(a.name||'').trim().toLowerCase()===String(b.name||'').trim().toLowerCase()}
function selectTLFile(projectId){const p=db.projects.find(x=>x.id===projectId);if(!p||p.type!=='研发'){alert('只有研发项目可以导入 TL');return}if(!window.XLSX){alert('Excel 解析组件未加载。请检查网络后刷新页面再试。');return}const input=document.createElement('input');input.type='file';input.accept='.xlsx,.xls,.xlsm';input.onchange=()=>{const f=input.files&&input.files[0];if(f)parseTLFile(f,projectId).catch(e=>{console.error(e);alert('TL 文件解析失败：'+(e.message||e))})};input.click()}
async function parseTLFile(file,projectId){if(!window.XLSX)throw new Error('Excel 解析组件未加载');const p=db.projects.find(x=>x.id===projectId);if(!p||p.type!=='研发')throw new Error('目标不是研发项目');const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});const parsed=[],categoryCounts={},missing=[],possibleGroups=[];let usedSheets=[];
for(const map of tlSheetMap){const sheetName=wb.SheetNames.find(n=>map.aliases.some(a=>tlNorm(n)===tlNorm(a)));if(!sheetName){missing.push(map.sheet);continue}usedSheets.push(sheetName);const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetName],{header:1,defval:'',raw:true});let hi=-1;for(let i=0;i<Math.min(rows.length,12);i++){if(rows[i].some(c=>['任务名称','任务名','taskname'].some(a=>tlNorm(c).includes(tlNorm(a))))){hi=i;break}}if(hi<0){missing.push(map.sheet+'（找不到任务名称列）');continue}const headers=rows[hi];const ix={wbs:tlFindCol(headers,['序号','WBS','编号']),name:tlFindCol(headers,['任务名称','任务名','taskname']),desc:tlFindCol(headers,['任务描述','描述','description']),pre:tlFindCol(headers,['前置任务','predecessor']),out:tlFindCol(headers,['输出物','交付物','deliverable']),risk:tlFindCol(headers,['风险等级','风险','risk']),urgency:tlFindCol(headers,['紧急程度','紧急性','urgency']),owner:tlFindCol(headers,['责任人','负责人','owner']),supervisor:tlFindCol(headers,['指导人','指导','supervisor']),ps:tlFindCol(headers,['计划开始','计划启动','plannedstart']),pe:tlFindCol(headers,['计划结束','计划完成','plannedend']),as:tlFindCol(headers,['实际开始','actualstart']),ae:tlFindCol(headers,['实际结束','actualend']),reviewer:tlFindCol(headers,['评审人','reviewer']),status:tlFindCol(headers,['进度状态','状态','status']),delay:tlFindCol(headers,['超期原因','延期原因','delayreason']),pct:tlFindCol(headers,['完成度','进度','progress'])};if(ix.name<0){missing.push(map.sheet+'（找不到任务名称列）');continue}
for(let ri=hi+1;ri<rows.length;ri++){const row=rows[ri],wbs=tlText(tlCell(row,ix.wbs)),name=tlText(tlCell(row,ix.name));if(!name||name.length<=4||!/^\d+(?:\.\d+){2,}$/.test(wbs))continue;const detailIdx=[ix.desc,ix.pre,ix.out,ix.risk,ix.urgency,ix.owner,ix.supervisor,ix.ps,ix.pe,ix.as,ix.ae,ix.reviewer,ix.status,ix.delay,ix.pct];const hasDetails=detailIdx.some(i=>i>=0&&tlText(tlCell(row,i))!=='');if(!hasDetails){possibleGroups.push(map.sheet+' · '+wbs+' '+name);continue}const rawStatus=tlText(tlCell(row,ix.status));let pct=tlPercent(tlCell(row,ix.pct));if(pct===null)pct=tlPercent(rawStatus);if(pct===null)pct=0;const task={id:'tl'+Date.now().toString(36)+Math.random().toString(36).slice(2,8),projectId,category:map.category,wbs,name,desc:tlText(tlCell(row,ix.desc)),predecessor:tlText(tlCell(row,ix.pre)),output:tlText(tlCell(row,ix.out)),risk:tlText(tlCell(row,ix.risk)),urgency:tlText(tlCell(row,ix.urgency)),owner:tlText(tlCell(row,ix.owner)),supervisor:tlText(tlCell(row,ix.supervisor)),planStart:tlDate(tlCell(row,ix.ps)),planEnd:tlDate(tlCell(row,ix.pe)),actualStart:tlDate(tlCell(row,ix.as)),actualEnd:tlDate(tlCell(row,ix.ae)),reviewer:tlText(tlCell(row,ix.reviewer)),status:tlStatus(rawStatus,pct),legacyStatus:rawStatus,delayReason:tlText(tlCell(row,ix.delay)),completion:pct,source:'TL'};parsed.push(task);categoryCounts[map.category]=(categoryCounts[map.category]||0)+1}}
if(usedSheets.length===0||parsed.length===0){alert('没有识别到有效 TL 任务。请确认文件包含 TL-系统、TL-机械、TL-硬件、TL-BSW、TL-ASW 工作表，且任务行有 WBS 编号和任务名称。');return}const existing=db.tasks.filter(t=>t.projectId===projectId);const duplicateCount=parsed.filter(t=>existing.some(e=>tlSameTask(e,t))).length;pendingTLImport={projectId,parsed,duplicateCount,possibleGroups,missing,fileName:file.name,categoryCounts};const summary=tlSheetMap.map(m=>'<div class="step"><strong>'+esc(m.category)+'</strong><div><b>'+((categoryCounts[m.category]||0))+' 条任务</b><small>'+esc(m.sheet)+'</small></div></div>').join('');$('#sheet').innerHTML='<div class="panelhead"><h2>导入 TL · '+esc(p.name)+'</h2><button onclick="closeModal()">取消</button></div><p>文件：'+esc(file.name)+'</p><div class="steps">'+summary+'</div><p class="muted" style="margin-top:12px">识别到 '+parsed.length+' 条任务；可能的分组标题跳过 '+possibleGroups.length+' 行；与当前项目疑似重复 '+duplicateCount+' 条。'+(missing.length?'未识别工作表：'+esc(missing.join('、')):'')+'</p><label class="field" style="margin-top:14px">导入方式<select id="tlImportMode"><option value="append">追加导入，自动跳过重复任务</option><option value="replace">替换当前项目已有的研发 TL 任务</option></select></label><p class="muted">建议首次导入选择“替换”；日常更新选择“追加”。替换只影响当前项目的研发 TL 任务，不影响其他项目。</p><div class="savebar"><button onclick="closeModal()">取消</button><button class="primary" onclick="confirmTLImport()">确认导入 '+parsed.length+' 条</button></div>';$('#modal').classList.add('on')}
function confirmTLImport(){if(!pendingTLImport)return;const d=pendingTLImport,mode=$('#tlImportMode')?.value||'append';if(mode==='replace'){const n=db.tasks.filter(t=>t.projectId===d.projectId&&cats.includes(canonicalCategory(t.category))).length;if(!confirm('将删除当前项目现有的 '+n+' 条研发 TL 任务，再导入 '+d.parsed.length+' 条。确定继续吗？'))return;db.tasks=db.tasks.filter(t=>t.projectId!==d.projectId||!cats.includes(canonicalCategory(t.category)))}let imported=0,skipped=0;for(const t of d.parsed){if(mode==='append'&&db.tasks.some(e=>e.projectId===d.projectId&&tlSameTask(e,t))){skipped++;continue}db.tasks.push(t);imported++}const p=db.projects.find(x=>x.id===d.projectId);if(p){const ts=db.tasks.filter(t=>t.projectId===d.projectId);p.progress=ts.length?Math.round(ts.reduce((a,t)=>a+(Number(t.completion)||0),0)/ts.length):0}pid=d.projectId;pendingTLImport=null;save();closeModal();renderProjects();renderTasks();renderOverview();renderDetail();alert('TL 导入完成：新增 '+imported+' 条'+(skipped?'，跳过重复 '+skipped+' 条':'')+'。')}
